name: link-check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require https Markdown links
        run: python -c "import pathlib,re,sys; text=pathlib.Path('README.md').read_text(encoding='utf-8'); links=re.findall(r'\\[[^\\]]+\\]\\(([^)]+)\\)', text); bad=[u for u in links if u.startswith('http:')];
print(f'checked {len(links)} links');
sys.exit(1 if bad else 0)"

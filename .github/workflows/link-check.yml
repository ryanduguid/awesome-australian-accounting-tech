name: link-check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Kept exactly as it was. lychee's --require-https is documented as "when
      # HTTPS is available, treat HTTP links as errors", so it lets an http://
      # link through on a host with no working HTTPS. This rule is
      # unconditional and needs no network, so it stays as its own step rather
      # than being folded into the checker below.
      - name: Require https Markdown links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path("README.md").read_text(encoding="utf-8")
          links = re.findall(r"\[[^\]]+\]\(([^)]+)\)", text)
          bad = [url for url in links if url.startswith("http:")]
          print(f"checked {len(links)} links")
          if bad:
              print("http links:")
              print("\n".join(bad))
              raise SystemExit(1)
          PY

      # An archived repository still answers 200, so lychee below cannot tell
      # a maintained home from a read-only archive. After the September 2026
      # consolidation every engine lives in a monorepo, and a link to the old
      # repository sends a reader to the archive. This step asks the GitHub
      # API once per ryanduguid repository and fails on an archived target.
      - name: Test the archived-target policy
        run: python scripts/test_check_archived_targets.py
      - name: Fail on links to archived ryanduguid repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_archived_targets.py

      # What the job was missing: the https step only ever inspected the
      # scheme, so a dead link passed green, which for a link list is the one
      # failure that matters. lycheeVersion is pinned as well as the action
      # ref, because pinning the action by SHA does not pin the binary it
      # downloads at run time.
      - name: Resolve every link in README.md
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Government hosts are bot-hostile in specific, known ways, and a
          # checker that cries wolf is worse than none. ato.gov.au answers 403
          # to any non-browser agent even on live pages, and data.gov.au
          # answers 302, so both are accepted rather than called broken. The
          # cost is that a genuinely removed ato.gov.au page reads as 403 and
          # passes; the 404 case, which is how a link list normally rots, is
          # still caught.
          #
          # sbr.gov.au and softwaredevelopers.ato.gov.au negotiate HTTP/2
          # badly enough that the request fails at the transport, which is not
          # a status code and cannot be accepted. They are excluded here and
          # checked by hand.
          args: >-
            --no-progress --max-retries 2 --max-redirects 5
            --accept 200,204,206,301,302,303,307,308,403
            --exclude '^https://(www\.sbr\.gov\.au|softwaredevelopers\.ato\.gov\.au)'
            README.md
          lycheeVersion: v0.24.2
          fail: true
